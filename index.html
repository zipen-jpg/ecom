<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online Interaktif</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding-bottom: 70px;
        }

        .hidden { display: none !important; }

        header {
            position: sticky;
            top: 0;
            background-color: #0d0d0d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 90;
            border-bottom: 1px solid #222;
        }

        .search-box {
            flex: 1;
            display: flex;
            background-color: #1e1e1e;
            border: 1px solid #ff2b55;
            border-radius: 20px;
            padding: 6px 16px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .cart-icon {
            position: relative;
            font-size: 22px;
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background-color: #ff2b55;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .btn-admin-link {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        .container {
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .product-card {
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            color: #ff2b55;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-detail {
            width: 100%;
            background: transparent;
            color: #ff2b55;
            border: 1px solid #ff2b55;
            padding: 5px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .product-btn-group {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .btn-add-cart {
            flex: 1;
            background-color: #ff2b55;
            color: white;
            border: none;
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-buy-now {
            flex: 1;
            background-color: #00b37e;
            color: white;
            border: none;
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* HALAMAN DETAIL PRODUK */
        .detail-header {
            position: sticky;
            top: 0;
            background: #0d0d0d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222;
            z-index: 90;
        }
        .btn-back {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .detail-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #222;
            border-radius: 8px;
        }
        .detail-desc {
            margin-top: 12px;
            font-size: 13px;
            color: #ddd;
            line-height: 1.5;
        }
        .detail-info {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
        }
        .detail-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #0d0d0d;
            border-top: 1px solid #222;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
        }
        .detail-bottom button { flex:1; padding: 10px; border-radius: 6px; border:none; font-weight:bold; cursor:pointer; }
        .btn-cart-detail { background: #222; color:#ff2b55; border:1px solid #ff2b55 !important; }
        .btn-buy-detail { background: #ff2b55; color:white; }

        /* MODAL PILIHAN */
        .modal-overlay {
            position: fixed;
            inset:0;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            display: none;
        }
        .modal-overlay.aktif { display: block; }
        .modal-bottom {
            position: fixed;
            bottom:0; left:0; right:0;
            background: #181818;
            border-radius: 12px 12px 0 0;
            padding: 16px;
            z-index: 1000;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-bottom.aktif { display: block; }
        .modal-judul {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .modal-tutup { font-size: 20px; cursor: pointer; color: #888; }
        .pilihan-group { margin: 12px 0; }
        .pilihan-label { font-size:12px; color:#aaa; margin-bottom:6px; display:block; }
        .pilihan-item { display: flex; gap:6px; flex-wrap:wrap; }
        .pilihan-item button {
            padding: 6px 12px; border:1px solid #444; background:transparent; color:white; border-radius:4px; font-size:12px; cursor:pointer;
        }
        .pilihan-item button.aktif { border-color:#ff2b55; color:#ff2b55; }
        .jumlah-group { display:flex; align-items:center; gap:12px; margin:12px 0; }
        .jumlah-group button { width:28px; height:28px; border:1px solid #444; background:transparent; color:white; border-radius:4px; cursor:pointer; }

        /* KERANJANG */
        .keranjang-item {
            display:flex; gap:10px; padding:10px; border-bottom:1px solid #222; align-items:center;
        }
        .keranjang-img { width:60px; height:60px; border-radius:6px; object-fit:cover; background:#222; }
        .keranjang-nama { flex:1; font-size:12px; }
        .keranjang-harga { color:#ff2b55; font-weight:bold; font-size:13px; }
        .keranjang-total {
            display:flex; justify-content:space-between; padding:12px; font-weight:bold;
            border-top:1px solid #222; margin-top:8px;
        }
        .btn-checkout { width:100%; background:#00b37e; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; margin-top:8px; cursor:pointer; }
    </style>
</head>
<body>

<!-- HALAMAN UTAMA -->
<div id="hal-utama">
    <header>
        <div class="search-box">
            <input type="text" id="cari" placeholder="Cari produk..." oninput="tampilProduk()">
        </div>
        <div class="cart-icon" onclick="bukaKeranjang()">🛒 <span class="cart-badge" id="jml-keranjang">0</span></div>
        <a href="admin.html" class="btn-admin-link">Admin</a>
    </header>
    <div class="container">
        <div class="section-title">Semua Produk</div>
        <div id="grid-produk" class="product-grid"></div>
    </div>
</div>

<!-- HALAMAN DETAIL -->
<div id="hal-detail" class="hidden">
    <div class="detail-header">
        <button class="btn-back" onclick="kembaliKeUtama()">←</button>
        <h3>Detail Produk</h3>
    </div>
    <div class="container">
        <img id="det-gambar" class="detail-img">
        <h2 id="det-nama" style="margin-top:12px; font-size:18px; font-weight:bold;"></h2>
        <p id="det-harga" style="color:#ff2b55; font-size:20px; font-weight:bold; margin-top:4px;"></p>
        <p id="det-ket" class="detail-desc"></p>
        <p id="det-ukuran" class="detail-info"></p>
        <p id="det-warna" class="detail-info"></p>
    </div>
    <div class="detail-bottom">
        <button class="btn-cart-detail" onclick="bukaPilihan()">+ Keranjang</button>
        <button class="btn-buy-detail" onclick="bukaPilihan()">Beli Sekarang</button>
    </div>
</div>

<!-- MODAL PILIHAN -->
<div id="overlay" class="modal-overlay" onclick="tutupPilihan()"></div>
<div id="modal-pilih" class="modal-bottom">
    <div class="modal-judul">
        <h3>Pilih Pesanan</h3>
        <span class="modal-tutup" onclick="tutupPilihan()">✕</span>
    </div>
    <div class="jumlah-group">
        <span>Jumlah:</span>
        <button onclick="ubahJumlah(-1)">-</button>
        <span id="nilai-jumlah">1</span>
        <button onclick="ubahJumlah(1)">+</button>
    </div>
    <div id="kotak-ukuran" class="pilihan-group hidden">
        <label class="pilihan-label">Ukuran</label>
        <div id="list-ukuran" class="pilihan-item"></div>
    </div>
    <div id="kotak-warna" class="pilihan-group hidden">
        <label class="pilihan-label">Warna</label>
        <div id="list-warna" class="pilihan-item"></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
        <button onclick="masukKeranjang()" style="flex:1; border:1px solid #ff2b55; color:#ff2b55; background:transparent; padding:8px; border-radius:6px; cursor:pointer;">+ Keranjang</button>
        <button onclick="beliLangsung()" style="flex:1; background:#ff2b55; color:#fff; border:none; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer;">Beli</button>
    </div>
</div>

<!-- MODAL KERANJANG -->
<div id="modal-keranjang" class="modal-bottom" style="border-radius:0; top:0; height:100%;">
    <div class="modal-judul">
        <h3>Keranjang Belanja</h3>
        <span class="modal-tutup" onclick="tutupKeranjang()">✕</span>
    </div>
    <div id="isi-keranjang"></div>
    <div class="keranjang-total">
        <span>Total Pembayaran</span>
        <span id="total-bayar">Rp 0</span>
    </div>
    <button class="btn-checkout">Lanjut ke Pembayaran</button>
</div>

<script>
const DB_PRODUK = 'db_toko_produk';
const DB_KERANJANG = 'db_toko_keranjang';
let produkAktif = null, jumlah = 1, pilihU = '', pilihW = '';

function ambilData(k) { return JSON.parse(localStorage.getItem(k)) || []; }
function simpanData(k, d) { localStorage.setItem(k, JSON.stringify(d)); }

// Buat gambar otomatis jika kosong
function buatGambarOtomatis(nama, warnaLatar) {
    const huruf = (nama || '?')[0].toUpperCase();
    const kodeWarna = warnaLatar || '#ff2b55';
    const svg = `<svg width="300" height="300"><rect width="100%" height="100%" fill="${kodeWarna}"/><text x="50%" y="55%" font-size="120" font-weight="bold" fill="white" text-anchor="middle">${huruf}</text></svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
}

// Data contoh awal
if (!localStorage.getItem(DB_PRODUK)) {
    const dataAwal = [
        { id:1, nama:'Kaos Polos Combed', harga:75000, deskripsi:'Bahan katun adem, nyaman dipakai sehari-hari', ukuran:'S,M,L,XL', warna:'Merah,Putih,Hitam', gambar:'', warnaLatar:'#ff2b55' },
        { id:2, nama:'Sepatu Sneakers Urban', harga:249000, deskripsi:'Sol empuk, awet dan gaya kekinian', ukuran:'38,39,40,41,42', warna:'Hitam,Putih', gambar:'', warnaLatar:'#ff9933' }
    ];
    simpanData(DB_PRODUK, dataAwal);
}

// Tampilkan semua produk
function tampilProduk() {
    const semuaProduk = ambilData(DB_PRODUK);
    const kataKunci = document.getElementById('cari').value.toLowerCase();
    const hasilCari = semuaProduk.filter(p => p.nama.toLowerCase().includes(kataKunci));

    document.getElementById('grid-produk').innerHTML = hasilCari.map(p => {
        const gambar = p.gambar || buatGambarOtomatis(p.nama, p.warnaLatar);
        return `
        <div class="product-card">
            <img src="${gambar}" class="product-img">
            <div class="product-details">
                <div class="product-title">${p.nama}</div>
                <div class="product-price">Rp ${p.harga.toLocaleString('id-ID')}</div>
                <button class="btn-detail" onclick="bukaDetail(${p.id})">Lihat Detail</button>
                <div class="product-btn-group">
                    <button class="btn-add-cart" onclick="tambahCepat(${p.id})">+ Keranjang</button>
                    <button class="btn-buy-now" onclick="bukaDetail(${p.id})">Beli</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

// Buka halaman detail
function bukaDetail(id) {
    const pilih = ambilData(DB_PRODUK).find(item => item.id === id);
    if (!pilih) return;
    produkAktif = pilih;
    const gambar = pilih.gambar || buatGambarOtomatis(pilih.nama, pilih.warnaLatar);

    document.getElementById('det-gambar').src = gambar;
    document.getElementById('det-nama').innerText = pilih.nama;
    document.getElementById('det-harga').innerText = `Rp ${pilih.harga.toLocaleString('id-ID')}`;
    document.getElementById('det-ket').innerText = pilih.deskripsi || 'Tidak ada deskripsi';
    document.getElementById('det-ukuran').innerText = pilih.ukuran ? `Ukuran tersedia: ${pilih.ukuran}` : '';
    document.getElementById('det-warna').innerText = pilih.warna ? `Pilihan warna: ${pilih.warna}` : '';

    document.getElementById('hal-utama').classList.add('hidden');
    document.getElementById('hal-detail').classList.remove('hidden');
}
function kembaliKeUtama() {
    document.getElementById('hal-detail').classList.add('hidden');
    document.getElementById('hal-utama').classList.remove('hidden');
}

// Modal pilihan pesanan
function bukaPilihan() {
    jumlah = 1; pilihU = ''; pilihW = '';
    document.getElementById('nilai-jumlah').innerText = jumlah;
    const daftarUkuran = produkAktif.ukuran ? produkAktif.ukuran.split(',') : [];
    const daftarWarna = produkAktif.warna ? produkAktif.warna.split(',') : [];

    document.getElementById('kotak-ukuran').classList.toggle('hidden', daftarUkuran.length === 0);
    document.getElementById('list-ukuran').innerHTML = daftarUkuran.map(u => `<button onclick="pilihUkuran('${u}')">${u}</button>`).join('');
    document.getElementById('kotak-warna').classList.toggle('hidden', daftarWarna.length === 0);
    document.getElementById('list-warna').innerHTML = daftarWarna.map(w => `<button onclick="pilihWarna('${w}')">${w}</button>`).join('');

    document.getElementById('overlay').classList.add('aktif');
    document.getElementById('modal-pilih').classList.add('aktif');
    tutupKeranjang();
}
function tutupPilihan() {
    document.getElementById('overlay').classList.remove('aktif');
    document.getElementById('modal-pilih').classList.remove('aktif');
}
function ubahJumlah(nilai) {
    jumlah = Math.max(1, jumlah + nilai);
    document.getElementById('nilai-jumlah').innerText = jumlah;
}
function pilihUkuran(u) {
    pilihU = u;
    document.querySelectorAll('#list-ukuran button').forEach(btn => btn.classList.toggle('aktif', btn.innerText === u));
}
function pilihWarna(w) {
    pilihW = w;
    document.querySelectorAll('#list-warna button').forEach(btn => btn.classList.toggle('aktif', btn.innerText === w));
}

// Fungsi keranjang
function masukKeranjang() {
    let keranjang = ambilData(DB_KERANJANG);
    const posisi = keranjang.findIndex(i => i.id === produkAktif.id && i.ukuran === pilihU && i.warna === pilihW);
    posisi >= 0 ? keranjang[posisi].jumlah += jumlah : keranjang.push({id:produkAktif.id, jumlah, ukuran:pilihU, warna:pilihW});
    simpanData(DB_KERANJANG, keranjang); hitungJumlahKeranjang(); tutupPilihan();
}
function beliLangsung() { masukKeranjang(); bukaKeranjang(); }
function tambahCepat(id) {
    let keranjang = ambilData(DB_KERANJANG);
    const ada = keranjang.find(i => i.id === id);
    ada ? ada.jumlah++ : keranjang.push({id, jumlah:1, ukuran:'', warna:''});
    simpanData(DB_KERANJANG, keranjang); hitungJumlahKeranjang();
}
function hitungJumlahKeranjang() {
    const total = ambilData(DB_KERANJANG).reduce((s,i) => s + i.jumlah, 0);
    document.getElementById('jml-keranjang').innerText = total;
}
function bukaKeranjang() {
    let keranjang = ambilData(DB_KERANJANG);
    let produk = ambilData(DB_PRODUK);
    let totalBayar = 0;
    document.getElementById('isi-keranjang').innerHTML = keranjang.map(i => {
        const brg = produk.find(x => x.id === i.id);
        if (!brg) return '';
        totalBayar += brg.harga * i.jumlah;
        const gbr = brg.gambar || buatGambarOtomatis(brg.nama, brg.warnaLatar);
        return `<div class="keranjang-item">
            <img src="${gbr}" class="keranjang-img">
            <div class="keranjang-nama">${brg.nama}<br><small>${i.ukuran} ${i.warna} x${i.jumlah}</small></div>
            <div class="keranjang-harga">Rp ${(brg.harga*i.jumlah).toLocaleString('id-ID')}</div>
        </div>`;
    }).join('');
    document.getElementById('total-bayar').innerText = `Rp ${totalBayar.toLocaleString('id-ID')}`;
    document.getElementById('overlay').classList.add('aktif');
    document.getElementById('modal-keranjang').classList.add('aktif');
}
function tutupKeranjang() {
    document.getElementById('overlay').classList.remove('aktif');
    document.getElementById('modal-keranjang').classList.remove('aktif');
}

// Jalankan saat halaman dibuka
tampilProduk(); hitungJumlahKeranjang();
</script>
</body>
</html>
