<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Toko Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#ff2d55',
          secondary: '#00c48c',
          gelap: '#121212',
          kartu: '#1e1e1e'
        },
        fontFamily: {
          display: ['Sora', 'sans-serif'],
          sans: ['Plus Jakarta Sans', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  .font-display { font-family: 'Sora', sans-serif; }
  body { background: #0d0d0d; color: #fff; }
  .hidden { display: none !important; }
  .produk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 768px) { .produk-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1024px) { .produk-grid { grid-template-columns: repeat(4, 1fr); } }
  .produk-card { background: #1e1e1e; border-radius: 14px; overflow: hidden; }
  .produk-gambar { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 800; color: #fff; }
  .btn-detail { border: 1px solid #ff2d55; color: #ff2d55; border-radius: 10px; padding: 8px; font-size: 14px; font-weight: 600; width: 100%; margin-bottom: 8px; transition: all .2s; }
  .btn-detail:active { background: #ff2d55; color: #fff; }
  .btn-keranjang { background: #ff2d55; color: #fff; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; width: 100%; border: none; transition: all .2s; }
  .btn-keranjang:active { transform: scale(.97); }
  .kategori-tab { padding: 8px 18px; border-radius: 20px; font-size: 14px; border: none; background: #2a2a2a; color: #ccc; white-space: nowrap; }
  .kategori-tab.aktif { background: #ff2d55; color: #fff; }
  .modal-latar { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 40; }
  .modal-isi { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; border-radius: 20px 20px 0 0; z-index: 50; max-height: 90vh; overflow-y: auto; }
  .pilihan { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pilihan button { border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  .pilihan button.pilih { border-color: #ff2d55; background: #ff2d55; color: #fff; }
  input[type="number"] { background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 8px; color: #fff; width: 70px; text-align: center; }
</style>
</head>
<body>

<!-- === HALAMAN UTAMA === -->
<div id="halamanToko" class="pb-20">
  <!-- Header -->
  <header class="sticky top-0 bg-black/80 backdrop-blur-sm px-4 py-3 z-30">
    <div class="flex items-center justify-between mb-3">
      <h1 class="font-display font-800 text-2xl flex items-center gap-2">
        <span class="bg-primary rounded-lg w-10 h-10 flex items-center justify-center">⚡</span> Toko.
      </h1>
      <div class="flex items-center gap-3">
        <button onclick="bukaKeranjang()" class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 256 256"><path d="M88,216a16,16,0,1,1-16-16A16,16,0,0,1,88,216Zm80-16a16,16,0,1,0,16,16A16,16,0,0,0,168,200Zm44-136H62.7L52.8,36.4A8,8,0,0,0,45.4,32H24A8,8,0,0,0,24,48H44.3L61,165.3a24,24,0,0,0,23.7,20.7H196a8,8,0,0,0,0-16H85.7a8,8,0,0,1-7.9-7L76,152H196a24,24,0,0,0,23.7-20.1l13.2-72A8,8,0,0,0,228,64Zm-16.6,24-13.2,72a8,8,0,0,1-7.9,7H74.7L62.7,88Z"/></svg>
          <span id="jumlahKeranjang" class="absolute -top-2 -right-2 bg-primary text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
        <a href="admin.html" class="border border-primary text-primary rounded-lg px-3 py-1.5 text-sm font-semibold">Admin →</a>
      </div>
    </div>
    <!-- Pencarian -->
    <input id="cariProduk" oninput="renderProduk()" type="text" placeholder="Cari produk..." class="w-full bg-kartu border border-gray-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-primary">
  </header>

  <!-- Kategori -->
  <div class="px-4 py-3 overflow-x-auto">
    <div id="daftarKategori" class="flex gap-2"></div>
  </div>

  <!-- Daftar Produk -->
  <main class="px-4">
    <div id="gridProduk" class="produk-grid"></div>
  </main>
</div>

<!-- === HALAMAN DETAIL PRODUK === -->
<div id="halamanDetail" class="hidden pb-24">
  <header class="sticky top-0 bg-black/80 backdrop-blur-sm px-4 py-3 flex items-center gap-3 z-30">
    <button onclick="tutupDetail()" class="text-xl">←</button>
    <h1 id="judulDetail" class="font-display font-700 text-lg">Detail Produk</h1>
  </header>
  <div class="px-4 pt-4">
    <div id="gambarDetail" class="w-full aspect-square rounded-xl flex items-center justify-center text-8xl font-bold mb-4"></div>
    <h2 id="namaDetail" class="font-display font-700 text-2xl mb-2"></h2>
    <p id="hargaDetail" class="text-primary font-bold text-xl mb-3"></p>
    <p id="deskripsiDetail" class="text-gray-400 text-sm mb-5"></p>

    <!-- Pilihan Ukuran & Warna -->
    <div class="mb-4">
      <p class="font-semibold mb-1">Ukuran</p>
      <div id="pilihUkuran" class="pilihan"></div>
    </div>
    <div class="mb-4">
      <p class="font-semibold mb-1">Warna</p>
      <div id="pilihWarna" class="pilihan"></div>
    </div>
    <div class="mb-6">
      <p class="font-semibold mb-1">Jumlah</p>
      <div class="flex items-center gap-3">
        <button onclick="ubahJumlah(-1)" class="w-9 h-9 rounded-full bg-kartu text-lg">-</button>
        <input id="jumlahBeli" type="number" value="1" min="1" class="w-16 text-center">
        <button onclick="ubahJumlah(1)" class="w-9 h-9 rounded-full bg-kartu text-lg">+</button>
      </div>
    </div>

    <div class="flex gap-3">
      <button onclick="tambahKeKeranjangDariDetail()" class="flex-1 py-3 rounded-xl border border-primary text-primary font-bold">+ Keranjang</button>
      <button onclick="beliSekarang()" class="flex-1 py-3 rounded-xl bg-primary text-white font-bold">Beli Sekarang</button>
    </div>
  </div>
</div>

<!-- === HALAMAN KERANJANG === -->
<div id="halamanKeranjang" class="hidden pb-32">
  <header class="sticky top-0 bg-black/80 backdrop-blur-sm px-4 py-3 flex items-center gap-3 z-30">
    <button onclick="tutupKeranjang()" class="text-xl">←</button>
    <h1 class="font-display font-700 text-lg">Keranjang</h1>
  </header>
  <div class="px-4 pt-3">
    <div id="isiKeranjang"></div>
    <p id="keranjangKosong" class="text-center text-gray-500 py-12">Keranjang masih kosong</p>
  </div>
  <div class="fixed bottom-0 left-0 right-0 bg-kartu border-t border-gray-800 px-4 py-3">
    <div class="flex justify-between items-center mb-2">
      <span class="font-semibold">Total:</span>
      <span id="totalKeranjang" class="font-bold text-primary text-lg">Rp 0</span>
    </div>
    <button onclick="bukaCheckout()" class="w-full bg-primary text-white py-3 rounded-xl font-bold">Checkout</button>
  </div>
</div>

<!-- === MODAL PILIHAN SAAT BELI === -->
<div id="modalBeli" class="hidden">
  <div class="modal-latar" onclick="tutupModalBeli()"></div>
  <div class="modal-isi p-5 pb-8">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-display font-700 text-lg">Konfirmasi Pesanan</h3>
      <button onclick="tutupModalBeli()" class="text-gray-400 text-xl">×</button>
    </div>
    <div id="ringkasPesanan" class="space-y-2 mb-4"></div>
    <div class="border-t border-gray-700 pt-3 mb-4">
      <div class="flex justify-between font-bold text-lg">
        <span>Total</span>
        <span id="totalPesanan" class="text-primary"></span>
      </div>
    </div>
    <button onclick="simpanTransaksi()" class="w-full bg-primary text-white py-3 rounded-xl font-bold">✓ Konfirmasi & Beli</button>
  </div>
</div>

<script>
  const KEY_PRODUK = 'db_produk_tokohijau';
  const KEY_TRANSAKSI = 'db_transaksi_tokohijau';
  const KEY_KERANJANG = 'keranjang_toko';

  let produkTerpilih = null;
  let ukuranTerpilih = null;
  let warnaTerpilih = null;

  // Data contoh awal
  const dataContoh = [
    { id:1, nama:'Kaos Polos Combed', harga:75000, kategori:'Fashion', stok:99, deskripsi:'Kaos polos bahan katun combed 30s, nyaman dipakai sehari-hari.', ukuran:'S,M,L,XL', varianWarna:'Putih,Hitam,Merah', inisial:'K', warnaLatar:'#ff3b30' },
    { id:2, nama:'Sepatu Sneakers Urban', harga:249000, kategori:'Fashion', stok:50, deskripsi:'Sepatu sneakers model terbaru, empuk dan awet dipakai jalan.', ukuran:'38,39,40,41,42,43', varianWarna:'Putih,Hitam,Biru', inisial:'S', warnaLatar:'#00c48c' },
    { id:3, nama:'Earphone Bluetooth', harga:125000, kategori:'Elektronik', stok:30, deskripsi:'Earphone nirkabel suara jernih, baterai tahan lama.', ukuran:'Standar', varianWarna:'Hitam,Putih,Biru', inisial:'E', warnaLatar:'#007aff' },
    { id:4, nama:'Powerbank 10000mAh', harga:99000, kategori:'Aksesoris', stok:45, deskripsi:'Powerbank kapasitas besar, pengisian cepat 2 port USB.', ukuran:'Standar', varianWarna:'Putih,Hitam,Merah,Emas', inisial:'P', warnaLatar:'#ff9500' }
  ];

  function ambilData(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; }
    catch(e) { return []; }
  }
  function simpanData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

  function ambilProduk() {
    let list = ambilData(KEY_PRODUK);
    if (!list.length) {
      simpanData(KEY_PRODUK, dataContoh);
      list = dataContoh;
    }
    return list;
  }

  function buatGambar(inisial, warnaLatar) {
    return `data:image/svg+xml;base64,${btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="${warnaLatar}"/><text x="100" y="140" font-size="120" font-weight="bold" fill="white" text-anchor="middle">${inisial||'?'}</text></svg>`)}`;
  }

  let kategoriAktif = 'Semua';
  function muatKategori() {
    const list = ambilProduk();
    const set = new Set(['Semua']);
    list.forEach(p=>p.kategori&&set.add(p.kategori));
    document.getElementById('daftarKategori').innerHTML = [...set].map(k=>`
      <button class="kategori-tab ${k===kategoriAktif?'aktif':''}" onclick="pilihKategori('${k}')">${k}</button>
    `).join('');
  }
  function pilihKategori(k) {
    kategoriAktif = k;
    muatKategori();
    renderProduk();
  }

  function renderProduk() {
    const cari = document.getElementById('cariProduk').value.toLowerCase();
    let list = ambilProduk();
    if (kategoriAktif!=='Semua') list = list.filter(p=>p.kategori===kategoriAktif);
    if (cari) list = list.filter(p=>p.nama.toLowerCase().includes(cari));

    document.getElementById('gridProduk').innerHTML = list.map(p=>{
      const gambar = p.gambar || buatGambar(p.inisial, p.warnaLatar);
      return `
      <div class="produk-card">
        <img src="${gambar}" class="w-full aspect-square object-cover" alt="${p.nama}">
        <div class="p-3">
          <p class="text-xs text-gray-400">${p.kategori}</p>
          <h3 class="font-semibold text-sm mt-1 line-clamp-2">${p.nama}</h3>
          <p class="text-primary font-bold mt-1">Rp ${p.harga.toLocaleString('id-ID')}</p>
          <button onclick="bukaDetail(${p.id})" class="btn-detail mt-2">Lihat Detail</button>
          <button onclick="tambahKeranjangLangsung(${p.id})" class="btn-keranjang">+ Keranjang</button>
        </div>
      </div>`;
    }).join('');
  }

  function bukaDetail(id) {
    produkTerpilih = ambilProduk().find(p=>p.id===id);
    if (!produkTerpilih) return;

    document.getElementById('judulDetail').textContent = produkTerpilih.nama;
    document.getElementById('namaDetail').textContent = produkTerpilih.nama;
    document.getElementById('hargaDetail').textContent = 'Rp ' + produkTerpilih.harga.toLocaleString('id-ID');
    document.getElementById('deskripsiDetail').textContent = produkTerpilih.deskripsi || 'Belum ada deskripsi.';

    const gambar = produkTerpilih.gambar || buatGambar(produkTerpilih.inisial, produkTerpilih.warnaLatar);
    document.getElementById('gambarDetail').innerHTML = `<img src="${gambar}" class="w-full h-full object-cover rounded-xl">`;

    // Pilihan Ukuran
    const ukuran = (produkTerpilih.ukuran||'Standar').split(',').map(s=>s.trim());
    document.getElementById('pilihUkuran').innerHTML = ukuran.map(u=>`<button onclick="pilihUkuran('${u}')">${u}</button>`).join('');
    ukuranTerpilih = ukuran[0];
    sorotPilihan('pilihUkuran', ukuranTerpilih);

    // Pilihan Warna
    const warna = (produkTerpilih.varianWarna||'Standar').split(',').map(w=>w.trim());
    document.getElementById('pilihWarna').innerHTML = warna.map(w=>`<button onclick="pilihWarna('${w}')">${w}</button>`).join('');
    warnaTerpilih = warna[0];
    sorotPilihan('pilihWarna', warnaTerpilih);

    document.getElementById('jumlahBeli').value = 1;

    document.getElementById('halamanToko').classList.add('hidden');
    document.getElementById('halamanDetail').classList.remove('hidden');
  }

  function tutupDetail() {
    document.getElementById('halamanDetail').classList.add('hidden');
    document.getElementById('halamanToko').classList.remove('hidden');
    produkTerpilih = null;
  }

  function pilihUkuran(u) { ukuranTerpilih = u; sorotPilihan('pilihUkuran', u); }
  function pilihWarna(w) { warnaTerpilih = w; sorotPilihan('pilihWarna', w); }
  function sorotPilihan(containerId, nilai) {
    document.querySelectorAll(`#${containerId} button`).forEach(b=>b.classList.toggle('pilih', b.textContent.trim()===nilai));
  }
  function ubahJumlah(by) {
    const el = document.getElementById('jumlahBeli');
    let v = parseInt(el.value||1) + by;
    if (v<1) v=1;
    el.value = v;
  }

  function ambilKeranjang() { return JSON.parse(localStorage.getItem(KEY_KERANJANG)||'[]'); }
  function simpanKeranjang(k) { localStorage.setItem(KEY_KERANJANG, JSON.stringify(k)); }
  function hitungJumlahKeranjang() {
    document.getElementById('jumlahKeranjang').textContent = ambilKeranjang().reduce((s,i)=>s+i.qty,0);
  }

  function tambahKeranjangLangsung(id) {
    const p = ambilProduk().find(x=>x.id===id);
    if (!p) return;
    tambahKeKeranjang({ id:p.id, nama:p.nama, harga:p.harga, gambar:p.gambar||buatGambar(p.inisial,p.warnaLatar), ukuran:'-', warna:'-', qty:1 });
    alert('✅ Ditambahkan ke keranjang!');
  }

  function tambahKeKeranjangDariDetail() {
    if (!produkTerpilih) return;
    const qty = parseInt(document.getElementById('jumlahBeli').value||1);
    tambahKeKeranjang({
      id: produkTerpilih.id,
      nama: produkTerpilih.nama,
      harga: produkTerpilih.harga,
      gambar: produkTerpilih.gambar || buatGambar(produkTerpilih.inisial, produkTerpilih.warnaLatar),
      ukuran: ukuranTerpilih||'-',
      warna: warnaTerpilih||'-',
      qty: qty
    });
    alert('✅ Ditambahkan ke keranjang!');
  }

  function tambahKeKeranjang(item) {
    const k = ambilKeranjang();
    const idx = k.findIndex(i=>i.id===item.id && i.ukuran===item.ukuran && i.warna===item.warna);
    if (idx>=0) k[idx].qty += item.qty;
    else k.push(item);
    simpanKeranjang(k);
    hitungJumlahKeranjang();
  }

  function bukaKeranjang() {
    document.getElementById('halamanToko').classList.add('hidden');
    document.getElementById('halamanDetail').classList.add('hidden');
    document.getElementById('halamanKeranjang').classList.remove('hidden');
    tampilKeranjang();
  }
  function tutupKeranjang() {
    document.getElementById('halamanKeranjang').classList.add('hidden');
    document.getElementById('halamanToko').classList.remove('hidden');
  }

  function tampilKeranjang() {
    const k = ambilKeranjang();
    document.getElementById('keranjangKosong').classList.toggle('hidden', k.length>0);
    document.getElementById('isiKeranjang').innerHTML = k.map((item,i)=>`
      <div class="bg-kartu rounded-xl p-3 mb-3 flex gap-3 items-center">
        <img src="${item.gambar}" class="w-16 h-16 rounded-lg object-cover">
        <div class="flex-1">
          <h4 class="font-semibold text-sm">${item.nama}</h4>
          <p class="text-xs text-gray-400">${item.ukuran} / ${item.warna}</p>
          <p class="text-primary font-bold text-sm">Rp ${item.harga.toLocaleString('id-ID')}</p>
          <div class="flex items-center gap-2 mt-1">
            <button onclick="ubahQtyKeranjang(${i},-1)" class="w-7 h-7 rounded-full bg-gray-700 text-xs">-</button>
            <span class="text-sm font-semibold">${item.qty}</span>
            <button onclick="ubahQtyKeranjang(${i},1)" class="w-7 h-7 rounded-full bg-gray-700 text-xs">+</button>
            <button onclick="hapusItemKeranjang(${i})" class="ml-auto text-red-500 text-xs">Hapus</button>
          </div>
        </div>
      </div>
    `).join('');
    const total = k.reduce((s,i)=>s + i.harga*i.qty,0);
    document.getElementById('totalKeranjang').textContent = 'Rp ' + total.toLocaleString('id-ID');
  }

  function ubahQtyKeranjang(idx, by) {
    const k = ambilKeranjang();
    k[idx].qty += by;
    if (k[idx].qty<1) k[idx].qty=1;
    simpanKeranjang(k);
    hitungJumlahKeranjang();
    tampilKeranjang();
  }
  function hapusItemKeranjang(idx) {
    const k = ambilKeranjang();
    k.splice(idx,1);
    simpanKeranjang(k);
    hitungJumlahKeranjang();
    tampilKeranjang();
  }

  function beliSekarang() {
    if (!produkTerpilih) return;
    const qty = parseInt(document.getElementById('jumlahBeli').value||1);
    bukaModalBeli([{
      nama: produkTerpilih.nama,
      harga: produkTerpilih.harga,
      ukuran: ukuranTerpilih,
      warna: warnaTerpilih,
      qty: qty
    }]);
  }
  function bukaCheckout() {
    const k = ambilKeranjang();
    if (!k.length) return alert('Keranjang masih kosong!');
    bukaModalBeli(k.map(i=>({nama:i.nama,harga:i.harga,ukuran:i.ukuran,warna:i.warna,qty:i.qty})));
  }
  function bukaModalBeli(items) {
    const total = items.reduce((s,i)=>s + i.harga*i.qty,0);
    document.getElementById('ringkasPesanan').innerHTML = items.map(i=>`
      <div class="flex justify-between text-sm">
        <span>${i.nama} × ${i.qty}<br><small class="text-gray-400">${i.ukuran} / ${i.warna}</small></span>
        <span class="font-semibold">Rp ${(i.harga*i.qty).toLocaleString('id-ID')}</span>
      </div>
    `).join('');
    document.getElementById('totalPesanan').textContent = 'Rp ' + total.toLocaleString('id-ID');
    document.getElementById('modalBeli').classList.remove('hidden');
    window._pesananSaatIni = items;
  }
  function tutupModalBeli() {
    document.getElementById('modalBeli').classList.add('hidden');
  }

  function simpanTransaksi() {
    const items = window._pesananSaatIni;
    if (!items||!items.length) return;
    const total = items.reduce((s,i)=>s + i.harga*i.qty,0);
    const transaksi = ambilData(KEY_TRANSAKSI);
    transaksi.push({ tanggal: new Date().toISOString(), items: items, total: total });
    simpanData(KEY_TRANSAKSI, transaksi);

    // Kosongkan keranjang setelah beli dari keranjang
    if (document.getElementById('halamanKeranjang').classList.contains('hidden')===false) {
      simpanKeranjang([]);
      hitungJumlahKeranjang();
      tampilKeranjang();
    }

    tutupModalBeli();
    alert('✅ Pesanan berhasil! Terima kasih!');
    tutupDetail();
  }

  // Sinkronisasi otomatis jika admin menambah/mengubah produk
  window.addEventListener('storage', (e) => {
    if (e.key === KEY_PRODUK) { renderProduk(); muatKategori(); }
  });

  // Inisialisasi
  muatKategori();
  renderProduk();
  hitungJumlahKeranjang();
</script>
</body>
</html>
