<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Toko Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: '#ff2b55', dark: '#0d0d0d', card: '#181818' },
        fontFamily: { display: ['Sora', 'sans-serif'], body: ['Plus Jakarta Sans', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .page { display: none; }
  .page.active { display: block; }
  .gambar-placeholder { display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: 800; }
</style>
</head>
<body class="bg-dark text-white pb-24">

<!-- HALAMAN UTAMA -->
<div id="halamanUtama" class="page active">
  <div class="sticky top-0 z-30 bg-dark/95 backdrop-blur border-b border-gray-800">
    <div class="max-w-4xl mx-auto p-3">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center font-bold">⚡</div>
          <h1 class="font-bold text-lg">Toko<span class="text-primary">.</span></h1>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="bukaKeranjang()" class="relative border border-gray-700 rounded-lg px-3 py-2">
            🛒 <span id="jumlahKeranjang" class="absolute -top-2 -right-2 bg-primary text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
          </button>
          <a href="admin.html" class="text-xs border border-gray-700 rounded-lg px-3 py-2">Admin</a>
        </div>
      </div>
      <input id="cariProduk" oninput="tampilkanProduk()" type="text" placeholder="Cari produk..." class="w-full bg-card border border-gray-800 rounded-lg p-2.5 text-sm outline-none">
      <div id="daftarKategori" class="flex gap-2 overflow-x-auto mt-3 pb-1"></div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto p-3">
    <div id="gridProduk" class="grid grid-cols-2 gap-3"></div>
  </div>
</div>

<!-- HALAMAN DETAIL -->
<div id="halamanDetail" class="page">
  <div class="sticky top-0 z-30 bg-dark/95 backdrop-blur border-b border-gray-800">
    <div class="max-w-4xl mx-auto p-3 flex items-center gap-3">
      <button onclick="kembaliKeUtama()" class="text-xl">←</button>
      <h1 class="font-bold">Detail Produk</h1>
    </div>
  </div>
  <div class="max-w-2xl mx-auto p-3">
    <div id="gambarDetail" class="w-full aspect-square rounded-xl"></div>
    <div class="mt-4 space-y-2">
      <span id="katDetail" class="text-xs text-gray-400"></span>
      <h2 id="namaDetail" class="font-bold text-xl"></h2>
      <p id="hargaDetail" class="font-bold text-primary text-2xl"></p>
      <p id="stokDetail" class="text-xs text-gray-400"></p>
      <p id="ukuranDetail" class="text-sm"></p>
      <p id="warnaDetail" class="text-sm"></p>
    </div>
    <div class="fixed bottom-0 left-0 right-0 bg-dark border-t border-gray-800 p-3 flex gap-2">
      <button onclick="bukaKeranjang()" class="w-16 border border-primary text-primary rounded-lg py-3 text-lg">🛒</button>
      <button onclick="bukaPilihan()" class="flex-1 bg-primary rounded-lg py-3 font-bold">Beli Sekarang</button>
    </div>
  </div>
</div>

<!-- MODAL PILIHAN -->
<div id="modalPilihan" class="hidden fixed inset-0 z-50 bg-black/80 flex items-end">
  <div class="bg-card w-full p-4 rounded-t-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold">Pilih Pesanan</h3>
      <button onclick="tutupPilihan()" class="text-xl">✕</button>
    </div>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="text-xs">Jumlah:</span>
        <button onclick="ubahJumlah(-1)" class="w-8 h-8 rounded border border-gray-700">-</button>
        <span id="nilaiJumlah" class="font-bold">1</span>
        <button onclick="ubahJumlah(1)" class="w-8 h-8 rounded border border-gray-700">+</button>
      </div>
      <div id="kotakUkuran" class="hidden">
        <p class="text-xs mb-1">Ukuran:</p>
        <div id="pilihUkuran" class="flex flex-wrap gap-2"></div>
      </div>
      <div id="kotakWarna" class="hidden">
        <p class="text-xs mb-1">Warna:</p>
        <div id="pilihWarna" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
    <div class="mt-4 flex gap-2">
      <button onclick="masukKeranjang()" class="flex-1 border border-primary text-primary rounded-lg py-2.5">+ Keranjang</button>
      <button onclick="beliLangsung()" class="flex-1 bg-primary rounded-lg py-2.5 font-bold">Beli</button>
    </div>
  </div>
</div>

<!-- MODAL KERANJANG -->
<div id="modalKeranjang" class="hidden fixed inset-0 z-40 bg-black/70 flex items-end">
  <div class="bg-card w-full max-w-4xl mx-auto rounded-t-2xl max-h-[80vh] flex flex-col">
    <div class="flex justify-between p-4 border-b border-gray-800">
      <h2 class="font-bold">Keranjang</h2>
      <button onclick="tutupKeranjang()" class="text-xl">✕</button>
    </div>
    <div id="isiKeranjang" class="flex-1 overflow-y-auto p-4"></div>
    <div class="p-4 border-t border-gray-800">
      <div class="flex justify-between mb-3">
        <span>Total</span>
        <span id="totalHarga" class="font-bold text-yellow-400">Rp 0</span>
      </div>
      <button onclick="bukaPilihan()" class="w-full bg-primary py-3 rounded-lg font-bold">Checkout</button>
    </div>
  </div>
</div>

<script>
const DB_PRODUK = 'db_toko_produk';
const DB_KERANJANG = 'db_toko_keranjang';
let produkAktif = null, jumlah = 1, pilihU = '', pilihW = '';

function ambilData(k) { return JSON.parse(localStorage.getItem(k)) || []; }
function simpanData(k, d) { localStorage.setItem(k, JSON.stringify(d)); }

// Gambar otomatis jika tidak ada link
function buatGambarHuruf(nama, warna) {
  const h = (nama||'?')[0].toUpperCase();
  const svg = `<svg width="300" height="300"><rect width="100%" height="100%" fill="${warna}"/><text x="50%" y="55%" font-size="120" font-weight="bold" fill="white" text-anchor="middle">${h}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

// Data contoh pertama kali
if (!localStorage.getItem(DB_PRODUK)) {
  const awal = [
    { id:1, nama:'Kaos Polos Combed', harga:75000, kategori:'Fashion', stok:20, warna:'#ff2b55', gambar:'', ukuran:'S,M,L,XL', varianWarna:'Merah,Putih,Hitam' },
    { id:2, nama:'Sepatu Sneakers Urban', harga:249000, kategori:'Fashion', stok:8, warna:'#ff9933', gambar:'', ukuran:'38,39,40,41,42', varianWarna:'Hitam,Putih' }
  ];
  simpanData(DB_PRODUK, awal);
}

function bukaHalaman(nama) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(nama).classList.add('active');
}
function kembaliKeUtama() { bukaHalaman('halamanUtama'); }

function bukaDetail(id) {
  const p = ambilData(DB_PRODUK).find(x=>x.id===id);
  if(!p) return;
  produkAktif = p;
  const gbr = p.gambar || buatGambarHuruf(p.nama, p.warna);
  document.getElementById('gambarDetail').innerHTML = `<img src="${gbr}" class="w-full h-full object-cover rounded-xl">`;
  document.getElementById('katDetail').innerText = p.kategori;
  document.getElementById('namaDetail').innerText = p.nama;
  document.getElementById('hargaDetail').innerText = `Rp ${p.harga.toLocaleString('id-ID')}`;
  document.getElementById('stokDetail').innerText = p.stok<=0 ? 'Stok habis' : `Sisa ${p.stok} buah`;
  document.getElementById('ukuranDetail').innerText = p.ukuran ? `Ukuran: ${p.ukuran}` : '';
  document.getElementById('warnaDetail').innerText = p.varianWarna ? `Warna: ${p.varianWarna}` : '';
  bukaHalaman('halamanDetail');
}

function tampilkanProduk() {
  const semua = ambilData(DB_PRODUK);
  const cari = document.getElementById('cariProduk').value.toLowerCase();
  const hasil = semua.filter(p=>p.nama.toLowerCase().includes(cari));
  document.getElementById('gridProduk').innerHTML = hasil.map(p=>{
    const g = p.gambar || buatGambarHuruf(p.nama, p.warna);
    return `
    <div class="bg-card rounded-xl border border-gray-800 overflow-hidden">
      <img src="${g}" class="w-full aspect-square object-cover">
      <div class="p-3">
        <p class="text-xs text-gray-400 uppercase">${p.kategori}</p>
        <h3 class="font-medium mt-1">${p.nama}</h3>
        <p class="font-bold text-primary mt-1">Rp ${p.harga.toLocaleString('id-ID')}</p>
        <button onclick="bukaDetail(${p.id})" class="w-full mt-2 text-xs border border-primary text-primary py-1.5 rounded">Lihat Detail</button>
        <button onclick="tambahKeranjang(${p.id})" class="w-full mt-1 text-xs font-bold bg-primary py-2 rounded">+ Keranjang</button>
      </div>
    </div>`;
  }).join('');
}

function bukaPilihan() {
  jumlah = 1; pilihU = ''; pilihW = '';
  document.getElementById('nilaiJumlah').innerText = jumlah;
  const u = produkAktif.ukuran ? produkAktif.ukuran.split(',') : [];
  const w = produkAktif.varianWarna ? produkAktif.varianWarna.split(',') : [];
  document.getElementById('kotakUkuran').classList.toggle('hidden', !u.length);
  document.getElementById('pilihUkuran').innerHTML = u.map(x=>`<button onclick="pilihUkuran('${x}')" class="px-3 py-1 border border-gray-700 rounded text-xs">${x}</button>`).join('');
  document.getElementById('kotakWarna').classList.toggle('hidden', !w.length);
  document.getElementById('pilihWarna').innerHTML = w.map(x=>`<button onclick="pilihWarna('${x}')" class="px-3 py-1 border border-gray-700 rounded text-xs">${x}</button>`).join('');
  document.getElementById('modalPilihan').classList.remove('hidden');
}
function tutupPilihan() { document.getElementById('modalPilihan').classList.add('hidden'); }
function ubahJumlah(n) { jumlah = Math.max(1, jumlah+n); document.getElementById('nilaiJumlah').innerText = jumlah; }
function pilihUkuran(x) { pilihU = x; document.querySelectorAll('#pilihUkuran button').forEach(b=>b.classList.toggle('border-primary', b.innerText===x)); }
function pilihWarna(x) { pilihW = x; document.querySelectorAll('#pilihWarna button').forEach(b=>b.classList.toggle('border-primary', b.innerText===x)); }

function masukKeranjang() {
  let k = ambilData(DB_KERANJANG);
  const idx = k.findIndex(i=>i.id===produkAktif.id && i.ukuran===pilihU && i.warna===pilihW);
  idx>=0 ? k[idx].qty+=jumlah : k.push({id:produkAktif.id, qty:jumlah, ukuran:pilihU, warna:pilihW});
  simpanData(DB_KERANJANG, k);
  perbaruiJumlah(); tutupPilihan();
}
function beliLangsung() { masukKeranjang(); bukaKeranjang(); }

function tambahKeranjang(id) {
  let k = ambilData(DB_KERANJANG);
  const ada = k.find(i=>i.id===id);
  ada ? ada.qty++ : k.push({id, qty:1, ukuran:'', warna:''});
  simpanData(DB_KERANJANG, k); perbaruiJumlah();
}
function perbaruiJumlah() {
  const total = ambilData(DB_KERANJANG).reduce((s,i)=>s+i.qty,0);
  document.getElementById('jumlahKeranjang').innerText = total;
}

function bukaKeranjang() {
  let k = ambilData(DB_KERANJANG);
  let p = ambilData(DB_PRODUK);
  let totalBayar = 0;
  document.getElementById('isiKeranjang').innerHTML = k.map(i=>{
    const brg = p.find(x=>x.id===i.id);
    if(!brg) return '';
    totalBayar += brg.harga*i.qty;
    return `<div class="flex items-center gap-3 py-2 border-b border-gray-800">
      <img src="${brg.gambar||buatGambarHuruf(brg.nama,brg.warna)}" class="w-12 h-12 rounded">
      <div class="flex-1"><p class="text-sm">${brg.nama}</p><p class="text-xs text-gray-400">${i.ukuran} ${i.warna} x${i.qty}</p></div>
    </div>`;
  }).join('');
  document.getElementById('totalHarga').innerText = `Rp ${totalBayar.toLocaleString('id-ID')}`;
  document.getElementById('modalKeranjang').classList.remove('hidden');
}
function tutupKeranjang() { document.getElementById('modalKeranjang').classList.add('hidden'); }

tampilkanProduk();
perbaruiJumlah();
</script>
</body>
</html>
