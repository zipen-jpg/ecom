<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online - Pelanggan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body { background: #0d0d0d; color: #fff; padding-bottom: 70px; }
        .hidden { display: none !important; }

        header {
            position: sticky; top:0; background: #0d0d0d; padding:12px 16px;
            display:flex; align-items:center; gap:12px; border-bottom:1px solid #222; z-index:90;
        }
        .search-box {
            flex:1; display:flex; background:#1e1e1e; border:1px solid #ff2b55;
            border-radius:20px; padding:6px 16px;
        }
        .search-box input {
            background:transparent; border:none; color:#fff; outline:none; width:100%; font-size:14px;
        }
        .cart-icon { position:relative; font-size:22px; cursor:pointer; }
        .cart-badge {
            position:absolute; top:-6px; right:-8px; background:#ff2b55; color:#fff;
            font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px;
        }
        .btn-admin {
            background:transparent; color:#888; border:1px solid #444; padding:4px 10px;
            border-radius:12px; font-size:11px; cursor:pointer; text-decoration:none; color:#fff;
        }
        .container { padding:12px; max-width:600px; margin:0 auto; }
        .section-title { font-size:16px; font-weight:bold; margin-bottom:12px; }
        .product-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .product-card {
            background:#181818; border-radius:8px; overflow:hidden; border:1px solid #222;
            display:flex; flex-direction:column;
        }
        .product-img { width:100%; height:140px; object-fit:cover; background:#2a2a2a; }
        .product-details { padding:10px; display:flex; flex-direction:column; gap:4px; }
        .product-title { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .product-price { color:#ff2b55; font-weight:bold; font-size:14px; }
        .btn-detail {
            width:100%; background:transparent; color:#ff2b55; border:1px solid #ff2b55;
            padding:5px; border-radius:6px; font-size:10px; cursor:pointer; margin:4px 0;
        }
        .btn-add-cart {
            width:100%; background:#ff2b55; color:#fff; border:none; padding:6px;
            border-radius:6px; font-size:10px; font-weight:bold; cursor:pointer;
        }

        /* HALAMAN DETAIL */
        .detail-header {
            position:sticky; top:0; background:#0d0d0d; padding:12px 16px; display:flex;
            align-items:center; gap:12px; border-bottom:1px solid #222; z-index:90;
        }
        .btn-back { background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; }
        .detail-img { width:100%; height:280px; object-fit:cover; background:#222; border-radius:8px; }
        .detail-desc { margin-top:12px; font-size:13px; color:#ddd; line-height:1.5; }
        .detail-info { margin-top:8px; font-size:12px; color:#aaa; }
        .detail-bottom {
            position:fixed; bottom:0; left:0; right:0; background:#0d0d0d; border-top:1px solid #222;
            padding:10px 16px; display:flex; gap:8px;
        }
        .detail-bottom button { flex:1; padding:10px; border-radius:6px; border:none; font-weight:bold; cursor:pointer; }
        .btn-cart { background:#222; color:#ff2b55; border:1px solid #ff2b55 !important; }
        .btn-buy { background:#ff2b55; color:#fff; }

        /* MODAL PILIHAN */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; display:none;
        }
        .modal-overlay.aktif { display:block; }
        .modal-pilih {
            position:fixed; bottom:0; left:0; right:0; background:#181818;
            border-radius:12px 12px 0 0; padding:16px; z-index:1000; display:none;
            max-height:80vh; overflow-y:auto;
        }
        .modal-pilih.aktif { display:block; }
        .modal-judul { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .modal-tutup { font-size:20px; cursor:pointer; color:#888; }
        .pilihan-group { margin-bottom:12px; }
        .pilihan-label { font-size:12px; color:#aaa; margin-bottom:6px; display:block; }
        .pilihan-item { display:flex; gap:6px; flex-wrap:wrap; }
        .pilihan-item button {
            padding:6px 12px; border:1px solid #444; background:transparent; color:#fff;
            border-radius:4px; font-size:12px; cursor:pointer;
        }
        .pilihan-item button.terpilih { border-color:#ff2b55; color:#ff2b55; }
        .jumlah-group { display:flex; align-items:center; gap:12px; margin:12px 0; }
        .jumlah-group button {
            width:28px; height:28px; border:1px solid #444; background:transparent;
            color:#fff; border-radius:4px; cursor:pointer;
        }

        /* KERANJANG */
        .keranjang-item {
            display:flex; gap:10px; padding:10px; border-bottom:1px solid #222; align-items:center;
        }
        .keranjang-img { width:60px; height:60px; border-radius:6px; object-fit:cover; background:#222; }
        .keranjang-nama { flex:1; font-size:12px; }
        .keranjang-harga { color:#ff2b55; font-weight:bold; font-size:13px; }
        .keranjang-total {
            display:flex; justify-content:space-between; padding:12px; font-weight:bold;
            border-top:1px solid #222; margin-top:8px;
        }
        .btn-checkout { width:100%; background:#00b37e; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; margin-top:8px; cursor:pointer; }
    </style>
</head>
<body>

<!-- HALAMAN UTAMA -->
<div id="hal-utama">
    <header>
        <div class="search-box">
            <input type="text" id="cari" placeholder="Cari produk..." oninput="tampilProduk()">
        </div>
        <div class="cart-icon" onclick="bukaKeranjang()">🛒 <span class="cart-badge" id="jml-keranjang">0</span></div>
        <a href="admin.html" class="btn-admin">Admin</a>
    </header>
    <div class="container">
        <div class="section-title">Semua Produk</div>
        <div id="grid-produk" class="product-grid"></div>
    </div>
</div>

<!-- HALAMAN DETAIL -->
<div id="hal-detail" class="hidden">
    <div class="detail-header">
        <button class="btn-back" onclick="kembali()">←</button>
        <h3>Detail Produk</h3>
    </div>
    <div class="container">
        <img id="det-gambar" class="detail-img">
        <h2 id="det-nama" style="margin-top:12px; font-size:18px; font-weight:bold;"></h2>
        <p id="det-harga" style="color:#ff2b55; font-size:20px; font-weight:bold; margin-top:4px;"></p>
        <p id="det-ket" class="detail-info"></p>
        <p id="det-ukuran" class="detail-info"></p>
        <p id="det-warna" class="detail-info"></p>
        <p id="det-desc" class="detail-desc"></p>
    </div>
    <div class="detail-bottom">
        <button class="btn-cart" onclick="bukaPilihan()">+ Keranjang</button>
        <button class="btn-buy" onclick="bukaPilihan()">Beli Sekarang</button>
    </div>
</div>

<!-- MODAL PILIHAN -->
<div id="overlay" class="modal-overlay" onclick="tutupPilihan()"></div>
<div id="modal-pilih" class="modal-pilih">
    <div class="modal-judul">
        <h3>Pilih Pesanan</h3>
        <span class="modal-tutup" onclick="tutupPilihan()">✕</span>
    </div>
    <div class="jumlah-group">
        <span>Jumlah:</span>
        <button onclick="ubahJumlah(-1)">-</button>
        <span id="nilai-jumlah">1</span>
        <button onclick="ubahJumlah(1)">+</button>
    </div>
    <div id="kotak-ukuran" class="pilihan-group hidden">
        <label class="pilihan-label">Ukuran</label>
        <div id="list-ukuran" class="pilihan-item"></div>
    </div>
    <div id="kotak-warna" class="pilihan-group hidden">
        <label class="pilihan-label">Warna</label>
        <div id="list-warna" class="pilihan-item"></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
        <button onclick="masukKeranjang()" style="flex:1; border:1px solid #ff2b55; color:#ff2b55; background:transparent; padding:8px; border-radius:6px; cursor:pointer;">+ Keranjang</button>
        <button onclick="beliLangsung()" style="flex:1; background:#ff2b55; color:#fff; border:none; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer;">Beli</button>
    </div>
</div>

<!-- MODAL KERANJANG -->
<div id="modal-keranjang" class="modal-pilih" style="border-radius:0; top:0; height:100%;">
    <div class="modal-judul">
        <h3>Keranjang Belanja</h3>
        <span class="modal-tutup" onclick="tutupKeranjang()">✕</span>
    </div>
    <div id="isi-keranjang"></div>
    <div class="keranjang-total">
        <span>Total</span>
        <span id="total-bayar">Rp 0</span>
    </div>
    <button class="btn-checkout" onclick="bukaPilihan()">Checkout</button>
</div>

<script>
const DB_PRODUK = 'db_toko';
const DB_KERANJANG = 'keranjang_toko';
let produkAktif = null, jumlah = 1, pilihU = '', pilihW = '';

function ambil(k) { return JSON.parse(localStorage.getItem(k)) || []; }
function simpan(k,d) { localStorage.setItem(k, JSON.stringify(d)); }

// Gambar otomatis
function buatGambar(nama, warna) {
    const h = (nama||'?')[0].toUpperCase();
    const svg = `<svg width="300" height="300"><rect width="100%" height="100%" fill="${warna}"/><text x="50%" y="55%" font-size="120" font-weight="bold" fill="white" text-anchor="middle">${h}</text></svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
}

// Data contoh awal
if (!localStorage.getItem(DB_PRODUK)) {
    const awal = [
        { id:1, nama:'Kaos Polos Combed', harga:75000, ket:'Bahan adem nyaman dipakai', ukuran:'S,M,L,XL', warna:'Merah,Putih,Hitam', gambar:'', warnaLatar:'#ff2b55' },
        { id:2, nama:'Sepatu Sneakers', harga:249000, ket:'Kualitas premium awet', ukuran:'38,39,40,41,42', warna:'Hitam,Putih', gambar:'', warnaLatar:'#ff9933' }
    ];
    simpan(DB_PRODUK, awal);
}

function tampilProduk() {
    const semua = ambil(DB_PRODUK);
    const cari = document.getElementById('cari').value.toLowerCase();
    const hasil = semua.filter(p=>p.nama.toLowerCase().includes(cari));
    document.getElementById('grid-produk').innerHTML = hasil.map(p=>{
        const g = p.gambar || buatGambar(p.nama, p.warnaLatar);
        return `<div class="product-card">
            <img src="${g}" class="product-img">
            <div class="product-details">
                <div class="product-title">${p.nama}</div>
                <div class="product-price">Rp ${p.harga.toLocaleString('id-ID')}</div>
                <button class="btn-detail" onclick="bukaDetail(${p.id})">Lihat Detail</button>
                <button class="btn-add-cart" onclick="tambahCepat(${p.id})">+ Keranjang</button>
            </div>
        </div>`;
    }).join('');
}

function bukaDetail(id) {
    const p = ambil(DB_PRODUK).find(x=>x.id===id);
    if(!p) return;
    produkAktif = p;
    const g = p.gambar || buatGambar(p.nama, p.warnaLatar);
    document.getElementById('det-gambar').src = g;
    document.getElementById('det-nama').innerText = p.nama;
    document.getElementById('det-harga').innerText = `Rp ${p.harga.toLocaleString('id-ID')}`;
    document.getElementById('det-ket').innerText = p.ket;
    document.getElementById('det-ukuran').innerText = p.ukuran ? `Ukuran: ${p.ukuran}` : '';
    document.getElementById('det-warna').innerText = p.warna ? `Warna: ${p.warna}` : '';
    document.getElementById('hal-utama').classList.add('hidden');
    document.getElementById('hal-detail').classList.remove('hidden');
}
function kembali() {
    document.getElementById('hal-detail').classList.add('hidden');
    document.getElementById('hal-utama').classList.remove('hidden');
}

function bukaPilihan() {
    jumlah = 1; pilihU = ''; pilihW = '';
    document.getElementById('nilai-jumlah').innerText = jumlah;
    const u = produkAktif.ukuran ? produkAktif.ukuran.split(',') : [];
    const w = produkAktif.warna ? produkAktif.warna.split(',') : [];
    document.getElementById('kotak-ukuran').classList.toggle('hidden', !u.length);
    document.getElementById('list-ukuran').innerHTML = u.map(x=>`<button onclick="pilihUkuran('${x}')">${x}</button>`).join('');
    document.getElementById('kotak-warna').classList.toggle('hidden', !w.length);
    document.getElementById('list-warna').innerHTML = w.map(x=>`<button onclick="pilihWarna('${x}')">${x}</button>`).join('');
    document.getElementById('overlay').classList.add('aktif');
    document.getElementById('modal-pilih').classList.add('aktif');
    tutupKeranjang();
}
function tutupPilihan() {
    document.getElementById('overlay').classList.remove('aktif');
    document.getElementById('modal-pilih').classList.remove('aktif');
}
function ubahJumlah(n) { jumlah = Math.max(1, jumlah+n); document.getElementById('nilai-jumlah').innerText = jumlah; }
function pilihUkuran(x) { pilihU=x; document.querySelectorAll('#list-ukuran button').forEach(b=>b.classList.toggle('terpilih', b.innerText===x)); }
function pilihWarna(x) { pilihW=x; document.querySelectorAll('#list-warna button').forEach(b=>b.classList.toggle('terpilih', b.innerText===x)); }

function masukKeranjang() {
    let k = ambil(DB_KERANJANG);
    const idx = k.findIndex(i=>i.id===produkAktif.id && i.u===pilihU && i.w===pilihW);
    idx>=0 ? k[idx].jml+=jumlah : k.push({id:produkAktif.id, jml:jumlah, u:pilihU, w:pilihW});
    simpan(DB_KERANJANG, k); hitungKeranjang(); tutupPilihan();
}
function beliLangsung() { masukKeranjang(); bukaKeranjang(); }
function tambahCepat(id) {
    let k = ambil(DB_KERANJANG);
    const ada = k.find(i=>i.id===id);
    ada ? ada.jml++ : k.push({id, jml:1, u:'', w:''});
    simpan(DB_KERANJANG, k); hitungKeranjang();
}

function hitungKeranjang() {
    const total = ambil(DB_KERANJANG).reduce((s,i)=>s+i.jml,0);
    document.getElementById('jml-keranjang').innerText = total;
}
function bukaKeranjang() {
    let k = ambil(DB_KERANJANG), p = ambil(DB_PRODUK), total=0;
    document.getElementById('isi-keranjang').innerHTML = k.map(i=>{
        const brg = p.find(x=>x.id===i.id); if(!brg) return '';
        total += brg.harga*i.jml;
        const g = brg.gambar || buatGambar(brg.nama, brg.warnaLatar);
        return `<div class="keranjang-item">
            <img src="${g}" class="keranjang-img">
            <div class="keranjang-nama">${brg.nama}<br><small>${i.u} ${i.w} x${i.jml}</small></div>
            <div class="keranjang-harga">Rp ${(brg.harga*i.jml).toLocaleString('id-ID')}</div>
        </div>`;
    }).join('');
    document.getElementById('total-bayar').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    document.getElementById('overlay').classList.add('aktif');
    document.getElementById('modal-keranjang').classList.add('aktif');
}
function tutupKeranjang() {
    document.getElementById('overlay').classList.remove('aktif');
    document.getElementById('modal-keranjang').classList.remove('aktif');
}

tampilProduk(); hitungKeranjang();
</script>
</body>
</html>
