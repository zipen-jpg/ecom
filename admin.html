<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Toko</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#2563EB'}}}}</script>
</head>
<body class="bg-gray-50">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <form onsubmit="masuk(event)" class="bg-white p-6 rounded-xl border w-full max-w-sm">
    <h2 class="text-center font-bold mb-4">Login Admin</h2>
    <input type="text" id="user" placeholder="Username" class="w-full border p-2 mb-2 rounded">
    <input type="password" id="pass" placeholder="Password" class="w-full border p-2 mb-3 rounded">
    <button class="w-full bg-primary text-white py-2 rounded">Masuk</button>
    <p class="text-center text-xs mt-2">admin / admin123</p>
  </form>
</div>
<div id="panel" class="hidden p-4">
  <h1 class="font-bold mb-4">Kelola Produk</h1>
  <div class="grid grid-cols-2 gap-2 mb-3">
    <input type="text" id="nm" placeholder="Nama Produk" class="border p-2 rounded">
    <input type="number" id="hr" placeholder="Harga" class="border p-2 rounded">
    <input type="text" id="kt" placeholder="Kategori" class="border p-2 rounded">
    <input type="number" id="st" placeholder="Stok" class="border p-2 rounded">
    <input type="text" id="uk" placeholder="Ukuran: S,M,L,XL" class="border p-2 rounded">
    <input type="text" id="wr" placeholder="Warna: Merah,Putih" class="border p-2 rounded">
  </div>
  <input type="text" id="gb" placeholder="Link Gambar (Opsional)" class="w-full border p-2 rounded mb-3">
  <button onclick="simpan()" class="bg-primary text-white py-2 rounded">Simpan Produk</button>
  <div class="mt-4"><table class="w-full text-xs"><thead><tr><th>Nama</th><th>Harga</th><th>Aksi</th></tr></thead><tbody id="tabel"></tbody></table></div>
  <a href="index.html" class="block mt-4 text-center border p-2 rounded">Kembali ke Toko</a>
</div>
<script>
const KUNCI = 'db_toko_produk'; let idUbah = null;
function ambil(k){return JSON.parse(localStorage.getItem(k))||[]}
function simpan(k,d){localStorage.setItem(k,JSON.stringify(d))}
function masuk(e){e.preventDefault();if(user.value==='admin'&&pass.value==='admin123'){login.classList.add('hidden');panel.classList.remove('hidden');tampil()}}
function tampil(){const p=ambil(KUNCI);tabel.innerHTML=p.map(x=>`<tr><td>${x.nama}</td><td>Rp ${x.harga.toLocaleString()}</td><td><button onclick="ubah(${x.id})" class="text-xs bg-green-500 text-white px-1 rounded">Ubah</button> <button onclick="hapus(${x.id})" class="text-xs bg-red-500 text-white px-1 rounded">Hapus</button></td></tr>`).join('')}
function simpan(){
  const p=ambil(KUNCI);
  if(idUbah){const x=p.find(i=>i.id===idUbah);x.nama=nm.value;x.harga=+hr.value;x.kategori=kt.value;x.stok=+st.value;x.ukuran=uk.value;x.varianWarna=wr.value;x.gambar=gb.value;idUbah=null}
  else{p.push({id:Date.now(),nama:nm.value,harga:+hr.value,kategori:kt.value,stok:+st.value,ukuran:uk.value,varianWarna:wr.value,gambar:gb.value,warna:'#'+Math.random().toString(16).slice(2,8)})}
  simpan(KUNCI,p);tampil();document.querySelectorAll('input').forEach(i=>i.value='')
}
function ubah(id){const x=ambil(KUNCI).find(i=>i.id===id);idUbah=id;nm.value=x.nama;hr.value=x.harga;kt.value=x.kategori;st.value=x.stok;uk.value=x.ukuran||'';wr.value=x.varianWarna||'';gb.value=x.gambar||''}
function hapus(id){if(confirm('Yakin?')){simpan(KUNCI,ambil(KUNCI).filter(i=>i.id!==id));tampil()}}
</script>
</body>
</html>
